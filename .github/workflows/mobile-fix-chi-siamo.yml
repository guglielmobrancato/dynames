name: DYNAMES mobile Chi Siamo fix

on:
  push:
    branches:
      - mobile-fix-chi-siamo-20260907

permissions:
  contents: write

jobs:
  patch-mobile-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile-fix-chi-siamo-20260907
          fetch-depth: 0

      - name: Patch mobile overflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('chi-siamo.html')
          s = p.read_text(encoding='utf-8')
          marker = '''
                  /* DYNAMES mobile overflow hotfix 2026-09-07 */
                  html, body {
                      width: 100%;
                      max-width: 100%;
                      overflow-x: hidden;
                  }

                  .container,
                  .team-grid,
                  .author-box,
                  .author-info,
                  .bio-static,
                  .bio-summary-copy,
                  .bio-content {
                      min-width: 0;
                  }

                  @media (max-width: 900px) {
                      .container {
                          width: 100%;
                          max-width: 100%;
                          padding-left: 1rem !important;
                          padding-right: 1rem !important;
                      }

                      .page-header {
                          width: 100%;
                          max-width: 100%;
                          overflow: hidden;
                      }

                      .team-jump-nav {
                          width: 100%;
                          max-width: 100%;
                          padding-left: 1rem;
                          padding-right: 1rem;
                      }

                      .page-content.container {
                          width: 100%;
                          max-width: 100%;
                      }

                      .page-content > .team-section {
                          width: 100%;
                          max-width: 100%;
                          padding-left: 0 !important;
                          padding-right: 0 !important;
                      }

                      .team-grid {
                          width: 100%;
                          max-width: 100%;
                          grid-template-columns: minmax(0, 1fr);
                      }

                      .author-box,
                      .author-info,
                      .bio-static,
                      .bio-summary-copy,
                      .bio-content {
                          width: 100%;
                          max-width: 100%;
                          min-width: 0;
                      }

                      .author-box {
                          overflow: hidden;
                      }

                      .profile-name,
                      .profile-role,
                      .strategic-theme,
                      .strategic-theme strong,
                      .author-info .bio-content p {
                          max-width: 100%;
                          overflow-wrap: anywhere;
                      }

                      .strategic-theme {
                          white-space: normal;
                      }

                      .js .bio-static:not(.is-expanded) .bio-content p {
                          width: 100%;
                          max-width: 100%;
                          min-width: 0;
                      }
                  }
          '''
          if 'DYNAMES mobile overflow hotfix 2026-09-07' not in s:
              pos = s.rfind('</style>')
              if pos < 0:
                  raise SystemExit('Closing style tag not found')
              s = s[:pos] + marker + s[pos:]
              p.write_text(s, encoding='utf-8')
          PY

      - name: Validate and remove temporary workflow
        shell: bash
        run: |
          grep -q 'DYNAMES mobile overflow hotfix 2026-09-07' chi-siamo.html
          grep -q 'grid-template-columns: minmax(0, 1fr)' chi-siamo.html
          rm -f .github/workflows/mobile-fix-chi-siamo.yml

      - name: Commit fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add chi-siamo.html .github/workflows/mobile-fix-chi-siamo.yml
          git commit -m 'Fix Chi Siamo mobile horizontal overflow'
          git push origin HEAD:mobile-fix-chi-siamo-20260907
